{% extends "base.html" %}
{% block title %}Caissier — EXPRESS{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0">💰 Espace Caissier</h2>
    <a href="{{ url_for('caissier.historique') }}" class="btn btn-noir">
        📜 Historique du jour
    </a>
</div>

<div id="zone-caissier"
     hx-get="{{ url_for('caissier.partial_zone') }}"
     hx-trigger="every 15s, refresh"
     hx-swap="innerHTML">
    {% include "caissier/_zone.html" %}
</div>
{% endblock %}

{% block scripts %}
<script>
    ["ORDER_SERVED", "PAYMENT_COMPLETED"].forEach(evt => {
        socket.on(evt, (data) => {
            if (evt === "ORDER_SERVED") {
                afficherNotification(
                    "🍽️ Commande #" + data.id + " servie (Table " +
                    data.table_numero + ")",
                    "success"
                );
            }
            rafraichirZone("#zone-caissier");
        });
    });
</script>
{% endblock %}
