{% extends "base.html" %}
{% block title %}Suivi — EXPRESS{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0">📋 Suivi des commandes</h2>
    <a href="{{ url_for('serveur.tables') }}" class="btn btn-noir">← Tables</a>
</div>

<div id="zone-commandes"
     hx-get="{{ url_for('serveur.partial_commandes') }}"
     hx-trigger="every 15s, refresh"
     hx-swap="innerHTML">
    {% include "serveur/_commandes_liste.html" %}
</div>
{% endblock %}

{% block scripts %}
<script>
    ["ORDER_READY", "ORDER_PREPARING", "ORDER_ACCEPTED", "ORDER_REJECTED",
     "NEW_ORDER", "NEW_QR_ORDER"].forEach(evt => {
        socket.on(evt, (data) => {
            if (evt === "ORDER_READY") {
                afficherNotification(
                    "🟢 COMMANDE #" + data.id + " PRÊTE<br>Table " + data.table_numero,
                    "success"
                );
            } else if (evt === "ORDER_PREPARING") {
                afficherNotification(
                    "👨‍🍳 Commande #" + data.id + " en préparation", "info"
                );
            }
            rafraichirZone("#zone-commandes");
        });
    });
</script>
{% endblock %}
