services:
  - type: web
    name: express
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet
      - key: FLASK_DEBUG
        value: "0"