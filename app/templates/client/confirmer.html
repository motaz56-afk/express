<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation — Table {{ table.numero }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f7f7f9; }</style>
</head>
<body>

<div class="container py-4">
    <h3>🛒 Votre commande</h3>
    <p class="text-muted">Table {{ table.numero }} — {{ resto.nom }}</p>

    <div class="card shadow-sm mb-3">
        <ul class="list-group list-group-flush">
        {% for item in panier %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>{{ item.nom }}</strong><br>
                    <small class="text-muted">
                        {{ '%.2f'|format(item.prix) }} DT × {{ item.quantite }}
                    </small>
                </div>
                <div class="d-flex gap-2">
                    <span>{{ '%.2f'|format(item.sous_total) }} DT</span>
                    <form method="POST"
                          action="{{ url_for('client_qr.retirer', restaurant_id=resto.id, token=table.token) }}">
                        <input type="hidden" name="product_id" value="{{ item.product_id }}">
                        <button class="btn btn-sm btn-outline-danger">−</button>
                    </form>
                </div>
            </li>
        {% endfor %}
        </ul>
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <strong>TOTAL</strong>
                <strong>{{ '%.3f'|format(total) }} DT</strong>
            </div>
        </div>
    </div>

    <form method="POST"
          action="{{ url_for('client_qr.envoyer', restaurant_id=resto.id, token=table.token) }}">
        <div class="mb-3">
            <label class="form-label">Note (optionnelle)</label>
            <input type="text" name="note" class="form-control"
                   placeholder="Ex : sans sucre, bien cuit…">
        </div>
        <button class="btn btn-success w-100 btn-lg">✅ CONFIRMER LA COMMANDE</button>
    </form>

    <a href="{{ url_for('client_qr.menu', restaurant_id=resto.id, token=table.token) }}"
       class="btn btn-link w-100 mt-2">← Retour au menu</a>
</div>

</body>
</html>
