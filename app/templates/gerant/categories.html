{% extends "base.html" %}
{% block title %}Catégories — EXPRESS{% endblock %}

{% block content %}
<h2 class="mb-4">📂 Catégories</h2>
{% include "gerant/_nav.html" %}

<div class="row g-4">
    <div class="col-md-7">
        <div class="card-luxe">
            <div class="card-header">Liste</div>
            <ul class="list-group list-group-flush">
            {% for c in categories %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <form method="POST"
                          action="{{ url_for('gerant.categorie_modifier', cid=c.id) }}"
                          class="d-flex gap-2 flex-grow-1 me-2">
                        <input type="text" name="emoji" value="{{ c.emoji or '' }}"
                               class="form-control form-control-sm" style="max-width:60px">
                        <input type="text" name="nom" value="{{ c.nom }}"
                               class="form-control form-control-sm">
                        <button class="btn btn-sm btn-outline-primary">💾</button>
                    </form>
                    <form method="POST"
                          action="{{ url_for('gerant.categorie_supprimer', cid=c.id) }}"
                          onsubmit="return confirm('Supprimer cette catégorie ?');">
                        <button class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                </li>
            {% else %}
                <li class="list-group-item text-muted">Aucune catégorie.</li>
            {% endfor %}
            </ul>
        </div>
    </div>

    <div class="col-md-5">
        <div class="card-luxe">
            <div class="card-header">➕ Nouvelle catégorie</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('gerant.categorie_nouvelle') }}">
                    <div class="mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" name="nom" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Emoji (optionnel)</label>
                        <input type="text" name="emoji" class="form-control" placeholder="☕">
                    </div>
                    <button class="btn btn-primary w-100">Créer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
