{% extends "base.html" %}
{% block title %}Table {{ table.numero }} — EXPRESS{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">💰 Encaissement — Table {{ table.numero }}</h2>
    <a href="{{ url_for('caissier.index') }}" class="btn btn-noir btn-sm">← Retour</a>
</div>

<div class="row g-4">
    <div class="col-lg-7">
        <div id="zone-commandes-caisse"
             hx-get="{{ url_for('caissier.partial_commandes', table_id=table.id) }}"
             hx-trigger="every 10s, refresh"
             hx-swap="innerHTML">
            {% include "caissier/_commandes_liste.html" %}
        </div>
    </div>

    <div class="col-lg-5">
        <div class="card-luxe sticky-top" style="top:1rem;">
            <div class="card-header" style="background:var(--succes);color:#fff;">
                Total à encaisser
            </div>
            <div class="card-body">
                <h2 class="text-center mb-4">{{ '%.3f'|format(total) }} DT</h2>
                <form method="POST"
                      action="{{ url_for('caissier.encaisser', table_id=table.id) }}">
                    <div class="mb-3">
                        <label class="form-label">Méthode de paiement</label>
                        <select name="methode" class="form-select" required>
                            {% for m in PaymentMethod.ALL %}
                                <option value="{{ m }}">{{ PaymentMethod.LABELS[m] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Note (optionnelle)</label>
                        <input type="text" name="notes" class="form-control">
                    </div>
                    <button class="btn btn-success w-100 btn-lg">✅ ENCAISSER</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
