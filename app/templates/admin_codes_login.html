<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Codes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#0f0f12;color:#faf7f2;display:flex;align-items:center;justify-content:center;min-height:100vh;}</style>
</head>
<body>
<div class="card p-4" style="max-width:400px;background:#1a1a20;border:1px solid #c8a86b;">
    <h3 style="color:#c8a86b;">🔐 Admin — Codes d'activation</h3>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <input type="password" name="mot_de_passe" class="form-control mb-3" required placeholder="Mot de passe admin">
        <button class="btn btn-warning w-100">Accéder</button>
    </form>
</div>
</body>
</html>
